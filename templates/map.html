<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта с выделением области</title>


    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 90vh;
        }

        #bbox-output {
            padding: 10px;
            font-family: monospace;
            background-color: #f8f8f8;
            border-top: 1px solid #ccc;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div id="map"></div>
<div id="bbox-output">Координаты области появятся здесь...</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>

    const map = L.map('map').setView([55.75, 37.62], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);


    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    let drawnRectangle = null;


    const drawControl = new L.Control.Draw({
        edit: {
            featureGroup: drawnItems
        },
        draw: {
            polygon: false,
            polyline: false,
            circle: false,
            marker: false,
            circlemarker: false,
            rectangle: true
        }
    });
    map.addControl(drawControl);


    map.on(L.Draw.Event.CREATED, function (event) {
        const layer = event.layer;

        if (drawnRectangle) {
            drawnItems.removeLayer(drawnRectangle);
        }

        drawnRectangle = layer;
        drawnItems.addLayer(layer);

        const bounds = layer.getBounds();
        const southWest = bounds.getSouthWest();
        const northEast = bounds.getNorthEast();


        const bbox = `${southWest.lng.toFixed(6)},${southWest.lat.toFixed(6)},${northEast.lng.toFixed(6)},${northEast.lat.toFixed(6)}`;
        document.getElementById('bbox-output').textContent = 'Bounding Box: ' + bbox;
    });
</script>

</body>
</html>
