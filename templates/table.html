<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица записей</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.datatables.net/v/bs5/jszip-2.5.0/dt-2.0.3/b-2.0.3/b-html5-2.0.3/datatables.min.css"
          rel="stylesheet"/>

    <style>
        body {
            padding-top: 60px;
        }

        table.dataTable thead th {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4">Список записей</h2>

    <table id="recordsTable" class="table table-striped table-bordered" style="width:100%">
        <thead>
        <tr>
            <th>Название</th>
            <th>Дата и время</th>
        </tr>
        </thead>
        <tbody>
        {% for record in records %}
            <tr>
                <td>{{ record.name }}</td>
                <td>{{ record.date|date:"Y-m-d H:i" }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

<script src="https://cdn.datatables.net/v/bs5/jszip-2.5.0/dt-2.0.3/b-2.0.3/b-html5-2.0.3/datatables.min.js"></script>

<script>
    $(document).ready(function () {
        $('#recordsTable').DataTable({
            dom: 'Bfrtip',
            buttons: [
                'csvHtml5'
            ],
            language: {
                url: '//cdn.datatables.net/plug-ins/2.0.3/i18n/ru.json'
            },
            paging: true,
            searching: true,
            ordering: true,
            info: true,
            pageLength: 10
        });
    });
</script>

</body>
</html>
